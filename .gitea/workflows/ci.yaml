---
# The Go correctness gate, now calling the shared pipeline in stump.wtf/ci
# instead of carrying its own copy. Same checks as before — gofmt, vet, build,
# test, and the race detector — but the steps live in one place, so a fix to
# the pipeline reaches every repo at once rather than needing a copy-paste
# sweep (which is how the aibot fork-checkout bug survived in two repos).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/go-service.yaml@main
    with:
      # gofmt excludes vendor/ (third-party sources are not ours to reformat);
      # go vet/build/test already ignore it in module mode.
      lint_cmd: |
        unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
        if [ -n "$unformatted" ]; then echo "unformatted:"; echo "$unformatted"; exit 1; fi
        go vet ./...
        go test ./...
        go test -race ./...
      build_cmd: go build ./...
      # -race REQUIRES cgo. The shared workflow defaults CGO_ENABLED=0 so pure-Go
      # modules prove they stay cgo-free; this repo must opt back in or the race
      # job fails to link. The daemon, supervisor, and protocol/attach packages
      # are built on goroutines, PTYs, and channels (SPEC-0002/0003), so the race
      # detector guards the whole module.
      cgo_enabled: "1"
    secrets: inherit
