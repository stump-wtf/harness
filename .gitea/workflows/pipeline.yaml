---
# The single end-to-end pipeline. One run, one dependency graph:
#
#   secret scan → lint → test → build ┬→ ai review   (PRs only)
#                                     └→ docs site   (builds everywhere,
#                                                     deploys only from main)
#
# Replaces three workflows that raced with no ordering between them
# (aibot.yml, gitleaks.yaml, ci.yaml). Stage bodies live in stump.wtf/ci; this
# file is just the graph.
#
# Ordering that matters:
#   * Secrets first — a leaked credential must not wait behind a compile.
#   * AI review LAST, behind the build. As its own workflow it fired the moment
#     a PR opened and spent tokens reviewing code not yet shown to compile or
#     pass tests.
#   * The docs site builds on EVERY event and deploys only from main. The fence
#     lives inside static-site.yaml, on the deploy step alone, so a PR
#     (including one from a fork) proves the site still compiles and stops
#     there. An earlier version fenced the whole `pages` job behind a
#     `main-only` gate job, which meant a docs-only PR merged without the site
#     ever being built.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. secret scan ------------------------------------------------------
  secrets:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/gitleaks.yaml@main
    secrets: inherit

  # ---- 2-4. lint + test + build -------------------------------------------
  build:
    needs: [secrets]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/go-service.yaml@main
    with:
      # `make check` is fmt + vet + test + race — the same four the old
      # ci.yaml ran as separate steps, now driven through the Makefile so the
      # local and CI gates cannot drift.
      lint_cmd: make check
      build_cmd: make build
      # `make check` includes `race`, and -race REQUIRES cgo. The shared
      # workflow defaults CGO_ENABLED=0 so pure-Go modules prove they stay
      # cgo-free; inheriting that default would break the race target.
      cgo_enabled: "1"
    secrets: inherit

  # ---- 5. ai review (PRs only, and only once the build is green) ----------
  review:
    needs: [build]
    if: ${{ github.event_name == 'pull_request' }}
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/aibot.yaml@main
    secrets: inherit

  # ---- 6. docs site: build always, deploy from main ------------------------
  # The LAN-side twin of the GitHub Pages deploy in .github/workflows/pages.yml.
  # Same build, same baseUrl (/harness/); only `url` differs, so the site_url
  # input is exported to the build as DOCS_URL. Without it the published site
  # would advertise the GitHub host in its canonical and og:url tags.
  #
  # The owner is slugified by garage-pages-deploy (lowercase, dots to dashes):
  # stump.wtf publishes to stump-wtf.pages.stump.rocks, because a two-label host
  # matches neither Caddy's *.pages.stump.rocks label nor its certificate.
  #
  # node 20, matching the GitHub twin, so the two hosts cannot drift onto
  # different toolchains. The shared default of 22 does build this site (run 3348
  # proved it), but Docusaurus is version-sensitive — node 23 fails outright on
  # ProgressPlugin validation — so the version is stated rather than inherited.
  #
  # `needs: [build]`, NOT a main-only gate. static-site.yaml already fences its
  # deploy step on the caller's ref being refs/heads/main; on a pull_request the
  # ref is refs/pull/<n>/merge, so the job builds and the deploy step skips. A
  # caller-side gate on top of that bought nothing and cost everything: it made
  # `pages` a skipped job on every PR, so a docs-only change could not fail CI
  # no matter what it broke in docs-site/.
  pages:
    needs: [build]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: docs-site
      source_dir: docs-site/build
      site_url: https://stump-wtf.pages.stump.rocks
      node_version: "20"
    secrets: inherit
