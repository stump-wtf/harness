# harness — tag-triggered release. Push a `v*` tag and this cuts a Gitea
# Release with cross-compiled tarballs (.goreleaser.yaml), then mirrors those
# same tarballs into the Gitea generic package registry.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Two publish targets, on purpose:
#   - Releases       — the front door, tied to the tag, with a changelog.
#   - Generic packages — stable, guessable URLs that don't move:
#       https://gitea.stump.rocks/api/packages/stump.wtf/generic/harness/<version>/<file>
#     which is what an install script or an Ansible get_url wants to point at.
#
# AUTH: GoReleaser uses the automatic per-run `gitea.token`, which is fine —
# it writes to THIS repo. The registry upload does not: `/api/packages/stump.wtf/`
# is owner scoped, and the per-run token is minted for whoever TRIGGERED the run,
# so its package scope follows the person who pushed the tag rather than the
# repo. v0.4.0 is the proof. Identical file, same Gitea 1.27.0, and yet:
#
#   v0.3.0  tag pushed by joestump         → uploaded, package creator joestump
#   v0.4.0  tag pushed by joestump-agent   → HTTP 401 on the first file
#
# Nothing had changed but the actor. So the upload prefers an explicit
# REGISTRY_TOKEN repo secret — a stump.wtf org owner's PAT with write:package,
# the same credential stump.wtf/switchboard's build.yaml uses — and only falls
# back to the per-run token, which keeps a joestump-cut release working until
# that secret exists. The `permissions:` block still grants `contents: write`
# (create the release) and `packages: write`.
#
# @joestump-agent 09/23/2026 - Replaced the claim that gitea.token is enough on
# 1.26+ with what v0.4.0 actually did, and made the upload prefer an explicit
# credential over an actor-bound one.
# @joestump-agent 09/23/2026 - Review: the credential reached curl's argv via
# -H "Authorization: …", readable from /proc while the upload ran; it now goes
# into a mktemp header file (-H @file) instead, so no process listing ever
# shows it.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and changelog from tag history, so
          # the default shallow clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ci.yaml gates PRs and main, but a tag can be pushed at any commit — so
      # re-run the correctness gate here rather than releasing on trust.
      - name: Test
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITEA_TOKEN: ${{ gitea.token }}

      # Mirror the archives + checksums into the generic package registry. The
      # registry rejects a re-upload of an existing version/filename with 409,
      # so re-running this workflow for an already-published tag fails loudly
      # instead of silently diverging from what is published. Delete the package
      # version in the UI first if a genuine re-cut is needed.
      #
      # Every failure here is named. The old version passed `curl -sSf` and let
      # exit 22 speak for itself, which is how a 401 caused by WHO PUSHED THE TAG
      # read as an unexplained CI failure.
      - name: Publish to the generic package registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          RUN_TOKEN: ${{ gitea.token }}
          REF_NAME: ${{ gitea.ref_name }}
          ACTOR: ${{ gitea.actor }}
        run: |
          set -euo pipefail

          # Prefer the explicit credential; the per-run token is the fallback
          # and carries the actor caveat in its own name, so the error below
          # can say which one was used without ever printing either.
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            token="${REGISTRY_TOKEN}"
            source="the REGISTRY_TOKEN secret"
          else
            token="${RUN_TOKEN}"
            source="the per-run gitea.token, minted for ${ACTOR}"
            echo "::warning::no REGISTRY_TOKEN secret — falling back to the per-run token, whose package scope follows ${ACTOR}"
          fi

          # The credential goes into a header FILE, not into curl's argv, so it
          # is invisible to /proc for the lifetime of the upload.
          hdr=$(mktemp)
          trap 'rm -f "$hdr"' EXIT
          printf 'Authorization: token %s\n' "$token" > "$hdr"

          version="${REF_NAME#v}"   # v0.1.0 → 0.1.0
          base="https://gitea.stump.rocks/api/packages/stump.wtf/generic/harness/${version}"
          for f in dist/*.tar.gz dist/checksums.txt; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            echo "→ ${base}/${name}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H @"$hdr" \
              --upload-file "$f" \
              "${base}/${name}")
            case "$code" in
              20*)
                ;;
              401 | 403)
                echo "::error::${code} publishing ${name} with ${source}. The per-run token is scoped to the actor who pushed the tag, not to the repo, so a release cut by someone without write:package on the stump.wtf org fails exactly here. Set a REGISTRY_TOKEN repo secret (a stump.wtf org owner PAT, write:package) and the upload stops depending on who cut the release."
                exit 1
                ;;
              409)
                echo "::error::409 — ${name} is already published for ${version}. Delete that package version before re-cutting the tag."
                exit 1
                ;;
              *)
                echo "::error::HTTP ${code} publishing ${name} with ${source}."
                exit 1
                ;;
            esac
          done
          echo "published harness ${version} to the generic registry with ${source}"
