# harness — tag-triggered release. Push a `v*` tag and this cuts a Gitea
# Release with cross-compiled tarballs (.goreleaser.yaml), then mirrors those
# same tarballs into the Gitea generic package registry.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Two publish targets, on purpose:
#   - Releases       — the front door, tied to the tag, with a changelog.
#   - Generic packages — stable, guessable URLs that don't move:
#       https://gitea.stump.rocks/api/packages/stump.wtf/generic/harness/<version>/<file>
#     which is what an install script or an Ansible get_url wants to point at.
#
# AUTH: the release step uses the automatic per-run `gitea.token`, which can
# create a release. The registry upload CANNOT: this instance's package
# registry rejects the per-run token with 401 (v0.4.0's run died there, and the
# generic registry has no 0.4.0), the same way its container registry does
# (see stump.wtf/ci's go-service.yaml). So the upload uses the stump.wtf org
# secret REGISTRY_TOKEN, the purpose-scoped write:package PAT the shared CI
# already pushes images with. The `permissions:` block still grants the
# per-run token `contents: write` for the release itself.
#
# @joestump 09/23/2026 - Moved the registry upload to REGISTRY_TOKEN after
# v0.4.0's upload failed 401 on the per-run token.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and changelog from tag history, so
          # the default shallow clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ci.yaml gates PRs and main, but a tag can be pushed at any commit — so
      # re-run the correctness gate here rather than releasing on trust.
      - name: Test
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITEA_TOKEN: ${{ gitea.token }}

      # Mirror the archives + checksums into the generic package registry. The
      # registry rejects a re-upload of an existing version/filename with 409,
      # so re-running this workflow for an already-published tag fails loudly
      # instead of silently diverging from what is published. Delete the package
      # version in the UI first if a genuine re-cut is needed.
      - name: Publish to the generic package registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::REGISTRY_TOKEN is not set — the per-run token is rejected by the package registry" >&2
            exit 1
          fi
          version="${REF_NAME#v}"   # v0.1.0 → 0.1.0
          base="https://gitea.stump.rocks/api/packages/stump.wtf/generic/harness/${version}"
          for f in dist/*.tar.gz dist/checksums.txt; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            echo "→ ${base}/${name}"
            curl -sSf \
              -H "Authorization: token ${TOKEN}" \
              --upload-file "$f" \
              "${base}/${name}"
          done
          echo "published harness ${version} to the generic registry"
